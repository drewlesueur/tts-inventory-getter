name: url::www.utcarmart.com/cars-for-sale
# CarsForSale platform, classic theme (li.vehicle-snapshot) behind DataDome —
# identical shape to santanmotor / statestreettruckstop / snbmotors / saiautosale.
# A direct curl gets DataDome's "Please enable JS" interstitial (403); Brave works.
#
# 48 results at 24 per page = "Page 1 of 2". Pagination is ?PageNumber=N
# (&PageSize=100), picked up from the .data-button-next-page control.
#
# Field notes:
#  * Price and mileage are the SAME class (.vehicle-snapshot__main-info) and are
#    told apart only by the sibling .vehicle-snapshot__label, hence :contains().
#    The platform config's [class*='mileage'] selector matches nothing here and
#    silently left every vehicle without an odometer reading.
#  * The SRP carries NO VIN at all (no data-vin, no 17-char token anywhere), so
#    VIN and the dealer stock number come from the VDP sweep — 48 detail fetches
#    through the bot-protection chain. Without them the normalizer falls back to
#    the listing id from the URL as the stock number.
#  * The site's own status filter defaults to "All Statuses", so this includes
#    SOLD units. ?SoldStatus=AvailableVehicles filters them, but the scrape runs
#    off the requested source URL, not this baseUrl, so it cannot be forced here.
baseUrl: https://www.utcarmart.com/cars-for-sale
listPage:
    waitSelectors:
        - li.vehicle-snapshot
    cardSelector: li.vehicle-snapshot
    titleSelector: .vehicle-snapshot__title
    urlSelector: a[href*='/details/']
    stockSelector: '[data-stock], [data-stock-no], [data-vehicle-stock-no], [itemprop=''sku'']'
    priceSelector: '.vehicle-snapshot__main-info-item:contains("Price") .vehicle-snapshot__main-info'
    mileageSelector: '.vehicle-snapshot__main-info-item:contains("Mileage") .vehicle-snapshot__main-info'
    imageSelector: img
    totalSelector: .data-inventory-total-records
    pagination:
        type: page_number
        nextSelector: .data-button-next-page
        loadMoreSelector: ""
        maxPages: 5
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - '[class*=''gallery''] img'
        - img[data-src*='carsforsale.com']
        - img[src*='carsforsale.com']
    # The VDP has no itemprop/data-vin anywhere; it renders label/value pairs as
    # .vdp-info-block__info-item-title + __info-item-description, with the VIN
    # value carrying .js-vin-message. Quoted because of the "#" in "Stock #" —
    # unquoted, YAML truncates the selector at the comment marker.
    vinSelector: '.js-vin-message, [itemprop=''vehicleIdentificationNumber''], [data-vin]'
    stockSelector: '.vdp-info-block__info-item-text:contains("Stock #") .vdp-info-block__info-item-description'
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: CarsForSale classic theme behind DataDome; PageNumber/PageSize pagination.
    discoveredAt: "2026-09-17T00:00:00Z"
