name: url::www.stricklandauto.com/inventory
baseUrl: https://www.stricklandauto.com/inventory
# MotorLot inventory. Prefer its stable data-mlr hooks over generated Tailwind
# classes. Stock and VIN are intentionally populated from each detail page.
listPage:
    waitSelectors:
        - '[data-mlr="vehicle-grid"]'
        - '[data-mlr="vehicle-card"]'
    cardSelector: '[data-mlr="vehicle-card"]'
    titleSelector: '[data-mlr="vehicle-card-title"]'
    urlSelector: 'a[href^="/inventory/"]'
    stockSelector: ""
    priceSelector: '[data-mlr="vehicle-card-price"]'
    mileageSelector: ""
    imageSelector: 'img[title*="at Strickland Auto"]'
    totalSelector: '#inv-total'
    pagination:
        type: next
        nextSelector: 'nav[aria-label="Pagination"] a[href*="page="]'
        loadMoreSelector: ""
        maxPages: 10
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - 'div[x-data*="active"] img[src*="cloudfront.net"]'
        - 'img[title*="at Strickland Auto"]'
    vinSelector: ""
    stockSelector: 'p.text-xs.text-gray-400.mt-2'
regex:
    stock: []
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
