name: url::www.usedvwaudi.com/search-used-cars-near-phoenix
baseUrl: https://www.usedvwaudi.com/search-used-cars-near-phoenix
listPage:
    waitSelectors: []
    cardSelector: li
    titleSelector: h2, h3
    urlSelector: a
    stockSelector: '[data-stock], [data-stock-no], [itemprop=''sku''], [class*=''stock''], [id*=''stock'']'
    priceSelector: .price, [class*='price']
    mileageSelector: .mileage, [class*='mileage']
    imageSelector: img
    totalSelector: ""
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 0
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - .gallery img
        - img[data-src]
        - img[src*='vehicle']
    vinSelector: ""
    stockSelector: ""
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    discoveredAt: "2026-08-29T14:00:26Z"
