name: url::www.usedvwaudi.com/search-used-cars-near-phoenix
baseUrl: https://www.usedvwaudi.com/search-used-cars-near-phoenix
listPage:
    waitSelectors:
        - .vehicle-list a.vehicle
    cardSelector: .vehicle-list > div
    titleSelector: .vehicle-header
    urlSelector: a.vehicle[href*='/inventory/']
    stockSelector: .stock span
    priceSelector: .vehicle-price-condensed .final
    mileageSelector: .vehicle-specs
    imageSelector: img
    totalSelector: .matches strong
    maxItems: 600
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 0
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - .gallery img
        - img[data-src]
        - img[src*='vehicle']
    vinSelector: ""
    stockSelector: ""
    skip: true
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    discoveredAt: "2026-08-29T14:00:26Z"
