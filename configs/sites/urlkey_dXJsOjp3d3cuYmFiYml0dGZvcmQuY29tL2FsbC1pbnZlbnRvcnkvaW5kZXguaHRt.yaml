name: url::www.babbittford.com/all-inventory/index.htm
# Dealer.com (DDC) — same shape as axioauto/kianmotors. Records come from the
# DDC.WS.state['ws-inv-data'] blob via expandDealerDotComInventory, paged with
# ?start=N. 136 vehicles at pageSize 24 = 6 pages.
# The blob already carries VIN/stock/price/mileage/photos, so no VDP fetching.
baseUrl: https://www.babbittford.com/all-inventory/index.htm
listPage:
    waitSelectors:
        - li.vehicle-card-detailed .price-value
    cardSelector: li.vehicle-card-detailed
    titleSelector: .vehicle-card-title
    urlSelector: a[href*='/used/'], a[href*='/certified/'], a[href*='/new/']
    stockSelector: .stockNumber
    priceSelector: .final-price .price-value, .price-value
    mileageSelector: .ddc-odometer, li.odometer
    imageSelector: img.ddc-photo, .img-container img
    totalSelector: .ddc-result-count
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 12
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors: []
    vinSelector: ""
    stockSelector: ""
    skip: true
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: Dealer.com DDC; 136 vehicles / 6 pages; cloud-scrapeable after deploy.
    discoveredAt: "2026-09-11T00:00:00Z"
