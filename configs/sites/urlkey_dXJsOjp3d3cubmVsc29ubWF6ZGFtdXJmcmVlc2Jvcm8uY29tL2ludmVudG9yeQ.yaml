name: url::www.nelsonmazdamurfreesboro.com/inventory
# Team Velocity / secureoffersites platform. The /inventory landing page is
# expanded into the new and used SRPs by expandTeamVelocityInventory.
baseUrl: https://www.nelsonmazdamurfreesboro.com/inventory
listPage:
    waitSelectors:
        - '[class*=''inventory-car-parent-box'']'
    cardSelector: '[class*=''inventory-car-parent-box'']'
    titleSelector: .oem-vehiclebox-title h2
    urlSelector: a[href*='/viewdetails/']
    stockSelector: .stock-number-field
    priceSelector: '[id$=''-your-price'']'
    mileageSelector: ""
    imageSelector: .vehicle-box-image img
    totalSelector: ""
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 1
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors: []
    vinSelector: '#copy_vin'
    stockSelector: '#copy_stock'
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: Team Velocity platform (secureoffersites.com); landing page expanded to new+used SRPs in Go.
    discoveredAt: "2026-09-16T00:00:00Z"
