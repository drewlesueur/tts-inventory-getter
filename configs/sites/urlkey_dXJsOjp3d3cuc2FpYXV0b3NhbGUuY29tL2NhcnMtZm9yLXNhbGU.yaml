name: url::www.saiautosale.com/cars-for-sale
baseUrl: https://www.saiautosale.com/cars-for-sale
listPage:
    waitSelectors: []
    cardSelector: .inventory-item, article, li
    titleSelector: h2, h3
    urlSelector: a
    stockSelector: '[data-stock], [data-stock-no], [itemprop=''sku''], [class*=''stock''], [id*=''stock'']'
    priceSelector: .price, [class*='price']
    mileageSelector: .mileage, [class*='mileage']
    imageSelector: img
    totalSelector: ""
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 0
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - .gallery img
        - img[data-src]
        - img[src*='vehicle']
    vinSelector: ""
    stockSelector: ""
regex:
    stock:
        - (?i)stock\\s*#?[:\\-]?\\s*([a-z0-9\\-]+)
    vin:
        - \\b([A-HJ-NPR-Z0-9]{17})\\b
discovery:
    discoveredAt: "2026-07-08T15:37:33Z"
