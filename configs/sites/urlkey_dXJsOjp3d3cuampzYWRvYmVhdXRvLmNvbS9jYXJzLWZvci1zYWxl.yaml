name: url::www.jjsadobeauto.com/cars-for-sale
baseUrl: https://www.jjsadobeauto.com/cars-for-sale
listPage:
    waitSelectors:
        - li.vehicle-snapshot
    cardSelector: li.vehicle-snapshot
    titleSelector: .vehicle-snapshot__title
    urlSelector: a[href*='/details/']
    stockSelector: '[data-stock], [data-stock-no], [itemprop=''sku''], [class*=''stock'']'
    priceSelector: .vehicle-snapshot__main-info-item:first-child .vehicle-snapshot__main-info
    mileageSelector: .vehicle-snapshot__main-info-item:nth-child(2) .vehicle-snapshot__main-info
    imageSelector: .vehicle-snapshot__image img
    totalSelector: .data-inventory-total-records
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 10
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors: []
    vinSelector: ""
    stockSelector: ""
regex:
    stock:
        - (?i)stock\\s*#?[:\\-]?\\s*([a-z0-9\\-]+)
    vin:
        - \\b([A-HJ-NPR-Z0-9]{17})\\b
discovery:
    notes: Carsforsale.com/DealerCenter inventory; DataDome-protected and paginated with PageNumber/PageSize
    discoveredAt: "2026-08-13T00:00:00Z"
