name: url::www.snbmotors.com/cars-for-sale
baseUrl: https://www.snbmotors.com/cars-for-sale?SoldStatus=AvailableVehicles
listPage:
    waitSelectors:
        - li.vehicle-snapshot
    cardSelector: li.vehicle-snapshot
    titleSelector: .vehicle-snapshot__title
    urlSelector: a[href*='/details/']
    stockSelector: '[data-stock], [data-stock-no], [data-vehicle-stock-no], [itemprop=''sku''], [class*=''stock'']'
    priceSelector: .vehicle-snapshot__main-info, [class*='price']
    mileageSelector: .mileage, [class*='mileage']
    imageSelector: img
    totalSelector: .inventory-results__count, [class*='results-count']
    pagination:
        type: page_number
        nextSelector: .data-button-next-page
        loadMoreSelector: ""
        maxPages: 5
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - '[class*=''gallery''] img'
        - img[data-src*='carsforsale.com']
        - img[src*='carsforsale.com']
    vinSelector: '[itemprop=''vehicleIdentificationNumber''], [data-vin]'
    stockSelector: '[itemprop=''sku''], [data-stock], [class*=''stock'']'
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: 'CarsForSale dealer platform; uses PageNumber/PageSize pagination.
        The SoldStatus dropdown defaults to AllVehicles, so the bare /cars-for-sale
        URL returns SOLD cars too (117 vs 40 available on 2026-09-19). baseUrl pins
        SoldStatus=AvailableVehicles; cmd/snb-sync does the same and aborts if the
        selected option is not AvailableVehicles. Do not drop the query param.'
    discoveredAt: "2026-09-01T00:00:00Z"
