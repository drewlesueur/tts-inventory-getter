name: url::www.autosensenh.com/search/used-chichester-nh
# 2026-09-24: this dealer MIGRATED off Dealer eProcess onto Overfuel, so the
# previous carbon-theme config (.vehicle_item cards, synthesized ?p=N pages)
# matched nothing. It scraped 25 of 85 for days: the eProcess pager was gone, so
# page 1 was read by a fallback and every synthesized page URL returned zero
# cards. Same shape as srprimeauto now.
#
# Overfuel (static.overfuel.com) on Next.js: the full record for every vehicle
# is in __NEXT_DATA__ at props.pageProps.inventory.results, which
# NextDataExtractor walks — the DOM selectors below are a backstop and for card
# counting. inventory.meta.total carries the count (82 at time of writing),
# 25 per page over a <link rel="next"> chain.
#
# The registered URL (/search/used-chichester-nh) is kept as baseUrl so the
# cache key does not move; the site redirects it to the canonical
# /used-cars-in-chichester-nh, whose rel=next chain the walker then follows.
#
# Unlike srprimeauto, this dealer DOES publish stock numbers (no nulls in the
# feed), so stockSelector is safe here — mapping a blank one would give every
# vehicle the same id and dedupeKey would collapse the page to one item.
baseUrl: https://www.autosensenh.com/search/used-chichester-nh/
listPage:
    waitSelectors:
        - '[data-cy=''vehicle-card'']'
    cardSelector: '[data-cy=''vehicle-card'']'
    titleSelector: h2
    urlSelector: a[href*='/inventory/']
    stockSelector: .srp-stocknum
    priceSelector: .label-price
    mileageSelector: .srp-miles .ms-auto
    imageSelector: img.img-srp
    totalSelector: ""
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 20
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors: []
    vinSelector: ""
    stockSelector: ""
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    discoveredAt: "2026-08-21T16:00:00Z"
