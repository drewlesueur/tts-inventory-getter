name: url::www.karlmalonefordsunvalley.com/all-inventory/index.htm
# Dealer.com (DDC) — same shape as babbittford/axioauto/kianmotors. Records come
# from the DDC.WS.state['ws-inv-data'] blob via expandDealerDotComInventory,
# paged with ?start=N; that blob also supplies totalCount/pageSize.
#
# ONE URL COVERS BOTH CONDITIONS. The dealer's /new-inventory/ (65) and
# /used-inventory/ (377) are filtered views of the same widget, and
# /all-inventory/ serves 65 + 377 = 442 — so this single config and cache key
# gives new and used together, with no second scrape to merge.
#
# No bot protection here, unlike kianmotors: a plain curl gets HTTP 200.
# 442 vehicles at pageSize 24 = 19 pages, hence the maxPages headroom.
baseUrl: https://www.karlmalonefordsunvalley.com/all-inventory/index.htm
listPage:
    waitSelectors:
        - li.vehicle-card-detailed .price-value
    cardSelector: li.vehicle-card-detailed
    titleSelector: .vehicle-card-title
    urlSelector: a[href*='/used/'], a[href*='/certified/'], a[href*='/new/']
    stockSelector: .stockNumber
    priceSelector: .final-price .price-value, .price-value
    mileageSelector: .ddc-odometer, li.odometer
    imageSelector: img.ddc-photo, .img-container img
    totalSelector: .ddc-result-count
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 25
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors: []
    vinSelector: ""
    stockSelector: ""
    # The ws-inv-data blob already carries VIN, stock, price, mileage and photos.
    skip: true
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: Dealer.com ws-inv-data; all-inventory covers new+used in one URL; ?start=N paging.
    discoveredAt: "2026-09-17T00:00:00Z"
