name: url::www.maxummotorsaz.com/cars-for-sale
# CarsForSale platform behind DataDome, but the NEWER Blazor theme — not the
# vehicle-snapshot markup: cards are li.vehicle-card, detail links are
# /Inventory/Details/<guid> (no VIN slug), and the pager has no hrefs at all.
# Clicking a page navigates to GET ?Paging.Page=N, which the server honors;
# extractBlazorPagingPageURLs synthesizes those from "Showing X - Y of Z".
# ?PageNumber / ?PageSize / ?sortBy are all silently ignored — don't bother.
# VINs live in JSON-LD blobs and on the VDP (detail fetch fills VIN/mileage).
# Fetches need Brave (residential/US) — direct curl gets the DataDome captcha.
baseUrl: https://www.maxummotorsaz.com/cars-for-sale
listPage:
    waitSelectors:
        - li.vehicle-card
    cardSelector: li.vehicle-card
    titleSelector: h2.inventory-title
    urlSelector: a[href*='/Inventory/Details/']
    stockSelector: ""
    priceSelector: .srp-ftc-headline .value
    mileageSelector: ""
    imageSelector: .card-top-img img
    totalSelector: ""
    pagination:
        type: ""
        nextSelector: ""
        loadMoreSelector: ""
        maxPages: 8
        infiniteScroll: false
        scrollMaxAttempts: 0
        clickMaxAttempts: 0
detailPage:
    imageSelectors:
        - '[class*=''gallery''] img'
        - img[src*='carsforsale']
    vinSelector: '[itemprop=''vehicleIdentificationNumber''], [data-vin]'
    stockSelector: '[itemprop=''sku''], [data-stock], [class*=''stock'']'
regex:
    stock:
        - (?i)stock\s*#?[:\-]?\s*([a-z0-9\-]+)
    vin:
        - \b([A-HJ-NPR-Z0-9]{17})\b
discovery:
    notes: CarsForSale Blazor theme; ?Paging.Page=N pagination synthesized from Showing X-Y of Z.
    discoveredAt: "2026-09-10T00:00:00Z"
