services:
  scraper:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Persist sqlite db, datadome cookie, and logs across restarts/redeploys.
      - ./data:/app/data
    restart: unless-stopped
    # Camoufox/Firefox can use significant shared memory.
    shm_size: "1gb"
