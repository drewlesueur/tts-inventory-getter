<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      padding: 16px;
      background: #2f3342;
      color: #fff;
      margin: 0;
    }
    h2 { margin: 0 0 16px; font-size: 15px; color: #F2DA00; font-weight: 600; }
    label { display: block; font-size: 11px; color: #bfbfbf; margin-bottom: 4px; margin-top: 12px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #1e2130;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #864797; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      background: #864797;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #9a56ae; }
    #status {
      margin-top: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    #status.ok { background: #1a3a2a; color: #4caf50; display: block; }
    #status.err { background: #3a1a1a; color: #f44336; display: block; }
    #lastSync { margin-top: 10px; font-size: 10px; color: #bfbfbf; }
  </style>
</head>
<body>
  <h2>DataDome Cookie Sync</h2>

  <label>Scraper Server URL</label>
  <input id="serverUrl" type="text" placeholder="https://your-server.com" />

  <label>Service Key</label>
  <input id="serviceKey" type="password" placeholder="your-service-key" />

  <button id="save">Save Settings</button>

  <div id="status"></div>
  <div id="lastSync"></div>

  <script src="popup.js"></script>
</body>
</html>
